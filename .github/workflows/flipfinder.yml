name: flipfinder

on:
  schedule:
    # Wakes every 30 minutes; the "when" job below decides whether to scan, using
    # the SCAN_HOURS repo variable (Settings → Secrets and variables → Actions →
    # Variables), so you change scan times without editing this file.
    #   SCAN_HOURS = 7-23            every half hour, 7am to 11:30pm UK time (default)
    #   SCAN_HOURS = 7-9,12,18-22    mornings, lunchtime and evenings
    #   SCAN_HOURS = off             paused
    # Hours are UK time (BST/GMT handled). Skipped wake-ups cost ~1 minute each, so
    # the total stays around 1,500 of the 2,000 free monthly minutes.
    # GitHub may delay scheduled runs by a few minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch: # "Run workflow" button for testing
    inputs:
      dry:
        description: "Dry run: print deals in the log, send nothing to Telegram"
        type: boolean
        default: true
      reset_seen:
        description: "Forget previously alerted listings, so current deals are sent again"
        type: boolean
        default: false
      ping:
        description: "Only test Telegram and the Jev key (skips the eBay scan)"
        type: boolean
        default: false

concurrency:
  group: flipfinder
  cancel-in-progress: false

jobs:
  when:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCAN_HOURS: ${{ vars.SCAN_HOURS }}
        run: |
          # Manual runs always go ahead.
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          spec=$(echo "${SCAN_HOURS:-7-23}" | tr -d ' ' | tr 'A-Z' 'a-z')
          hour=$(TZ=Europe/London date +%-H)
          run=false
          if [ "$spec" != "off" ]; then
            IFS=',' read -ra parts <<< "$spec"
            for p in "${parts[@]}"; do
              if [[ "$p" =~ ^([0-9]{1,2})-([0-9]{1,2})$ ]]; then
                [ "$hour" -ge "${BASH_REMATCH[1]}" ] && [ "$hour" -le "${BASH_REMATCH[2]}" ] && run=true
              elif [[ "$p" =~ ^[0-9]{1,2}$ ]]; then
                [ "$hour" -eq "$p" ] && run=true
              else
                echo "::warning::Ignoring '$p' in SCAN_HOURS (use e.g. 7-9,12,18-22 or off)"
              fi
            done
          fi
          echo "UK hour $hour, SCAN_HOURS='$spec' → scan=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  scan:
    needs: when
    if: needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Remember which listings were already alerted between runs.
      - name: Restore seen listings
        uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Forget seen listings
        if: ${{ inputs.reset_seen }}
        run: rm -f seen.json

      - name: Scan eBay
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_ENV: ${{ vars.EBAY_ENV }} # set to "sandbox" for sandbox keys; empty means production
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: go run . -config watchlist.json -state seen.json ${{ inputs.ping && '-ping' || (inputs.dry && '-dry -v' || '') }}

      - name: Save seen listings
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
